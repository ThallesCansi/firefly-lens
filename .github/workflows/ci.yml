name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  render-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f analytics/Dockerfile.render -t firefly-render .
      - name: Verify real history under the free instance memory limit
        env:
          ANALYTICS_API_TOKEN: ci-container-test-only
        run: |
          docker run -d --name analytics --memory=512m --memory-swap=512m -p 10000:10000 -e ANALYTICS_API_TOKEN firefly-render
          python scripts/smoke-render-analytics.py http://localhost:10000
          docker stats --no-stream analytics
      - name: Container diagnostics
        if: always()
        run: docker logs analytics || true
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  analytics:
    runs-on: ubuntu-latest
    steps:
      # Published scientific snapshots verify their archived engine Git sources.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: analytics/pyproject.toml
      - run: python -m pip install --editable './analytics[api,weather]' requests pyarrow pyyaml python-dotenv
      - run: python -m unittest discover -s analytics/tests -v
      - run: python -m unittest discover -s analytics/integration -v
