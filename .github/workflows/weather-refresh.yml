name: Refresh official NASA weather
on:
  schedule:
    - cron: '23 6,18 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: weather-publisher
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --editable './analytics[weather]' requests
      - run: python analytics/import_gfwed.py --days 3
      - run: python analytics/package_weather.py weather-bundle.json
      - name: Publish validated single-file product
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view weather-data --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create weather-data --repo "$GITHUB_REPOSITORY" --target main --title "Official NASA experimental weather data" --notes "Automatically refreshed numeric NASA GFWED/GEOS-5 subset and source provenance. Experimental research forecast; validity and source hashes are embedded."
          gh release upload weather-data weather-bundle.json --repo "$GITHUB_REPOSITORY" --clobber
