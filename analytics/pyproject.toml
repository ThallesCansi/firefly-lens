[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "firefly-analytics"
version = "0.1.0"
description = "Independent historical analytics and experimental forecasting for harmonized hotspots"
requires-python = ">=3.12"
dependencies = [
  "duckdb>=1.3,<2",
  "numpy>=2,<3",
  "pandas>=2.2,<3",
  "shapely>=2,<3",
  "statsmodels>=0.14.6,<0.15",
  "jsonschema>=4.23,<5",
]

[project.scripts]
firefly-analytics = "firefly_analytics.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
firefly_analytics = ["*.schema.json"]
